name: Build Sana Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK PATH
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_SDK_MANAGER" --licenses || true

      - name: Install Android SDK components
        shell: bash
        run: |
          "$ANDROID_SDK_MANAGER" "platform-tools"
          "$ANDROID_SDK_MANAGER" "platforms;android-35"
          "$ANDROID_SDK_MANAGER" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          "$ANDROID_SDK_MANAGER" --list_installed
          adb version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
