name: Build Sana Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout Sana Android
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$SDK_ROOT"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          mkdir -p "$SDK_ROOT/cmdline-tools"

          unzip -q \
            commandlinetools.zip \
            -d "$SDK_ROOT/cmdline-tools"

          mv \
            "$SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # 4. Android SDK packages
      # ============================================================
      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;27.0.12077973"

      # ============================================================
      # 5. Verify native toolchain
      # ============================================================
      - name: Verify native toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          "$NDK/ndk-build" --version

          test -f \
            "$NDK/build/cmake/android.toolchain.cmake"

          echo "Android CMake toolchain found."

          echo ""
          echo "======================================"
          echo "CMAKE"
          echo "======================================"

          "$CMAKE" --version

      # ============================================================
      # 6. Checkout MNN source
      # ============================================================
      - name: Checkout MNN
        shell: bash
        run: |
          set -e

          mkdir -p third_party

          git clone \
            --depth 1 \
            https://github.com/alibaba/MNN.git \
            third_party/MNN

          echo "MNN source downloaded."

          echo ""
          echo "MNN COMMIT:"
          git -C third_party/MNN rev-parse HEAD

      # ============================================================
      # 7. Verify MNN headers
      # ============================================================
      - name: Verify MNN headers
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING MNN HEADERS"
          echo "======================================"

          MNN_HEADER="$(find third_party/MNN \
            -type f \
            -path "*/MNN/Interpreter.hpp" \
            -print \
            -quit)"

          if [ -z "$MNN_HEADER" ]; then
            echo "ERROR: MNN/Interpreter.hpp was not found."
            echo ""
            echo "Searching MNN directory:"
            find third_party/MNN \
              -type f \
              -name "Interpreter.hpp" \
              -print

            exit 1
          fi

          echo "MNN/Interpreter.hpp FOUND:"
          echo "$MNN_HEADER"

          MNN_INCLUDE_DIR="$(dirname "$(dirname "$MNN_HEADER")")"

          echo ""
          echo "MNN include directory:"
          echo "$MNN_INCLUDE_DIR"

          echo ""
          echo "Header test:"

          test -f \
            "$MNN_INCLUDE_DIR/MNN/Interpreter.hpp"

          echo "MNN header verification successful."

      # ============================================================
      # 8. Prepare directories
      # ============================================================
      - name: Prepare MNN Android library directory
        shell: bash
        run: |
          set -e

          mkdir -p \
            app/src/main/jniLibs/arm64-v8a

      # ============================================================
      # 9. Restore compiled MNN cache
      # ============================================================
      - name: Restore MNN native cache
        id: mnn-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libMNN.so
          key: sana-mnn-arm64-opencl-ndk27-v1

      # ============================================================
      # 10. Build MNN only when cache misses
      # ============================================================
      - name: Build MNN Android
        if: steps.mnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.0.12077973"

          cd third_party/MNN

          rm -rf build_android

          mkdir -p build_android

          cd build_android

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF

          cmake --build . \
            --config Release \
            --parallel 2

      # ============================================================
      # 11. Install MNN shared library
      # ============================================================
      - name: Install MNN shared library
        shell: bash
        run: |
          set -e

          DEST="app/src/main/jniLibs/arm64-v8a/libMNN.so"

          if [ -f "$DEST" ]; then
            echo "======================================"
            echo "MNN CACHE HIT"
            echo "======================================"

            echo "Using cached libMNN.so:"
            ls -lh "$DEST"

            exit 0
          fi

          echo "======================================"
          echo "MNN CACHE MISS"
          echo "======================================"

          echo "Searching for compiled libMNN.so..."

          MNN_LIB="$(find third_party/MNN \
            -type f \
            -name "libMNN.so" \
            -print \
            -quit)"

          if [ -z "$MNN_LIB" ]; then
            echo "ERROR: libMNN.so was not found."
            echo ""
            echo "Available MNN libraries:"

            find third_party/MNN \
              -type f \
              \( \
                -name "libMNN.so" \
                -o \
                -name "libMNN.a" \
              \) \
              -print

            exit 1
          fi

          echo "FOUND:"
          echo "$MNN_LIB"

          cp \
            "$MNN_LIB" \
            "$DEST"

          echo ""
          echo "Installed MNN:"
          ls -lh "$DEST"

      # ============================================================
      # 12. Verify MNN integration
      # ============================================================
      - name: Verify MNN integration files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MNN INTEGRATION"
          echo "======================================"

          test -f \
            app/src/main/jniLibs/arm64-v8a/libMNN.so

          test -d \
            third_party/MNN/source

          echo "MNN library:"
          ls -lh \
            app/src/main/jniLibs/arm64-v8a/libMNN.so

          echo ""
          echo "MNN source:"
          du -sh third_party/MNN/source

          echo ""
          echo "MNN headers:"
          test -f \
            third_party/MNN/include/MNN/Interpreter.hpp

          echo "MNN integration files verified."

      # ============================================================
      # 13. Install Gradle 8.9
      # ============================================================
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          cd "$HOME"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O gradle.zip

          unzip -q gradle.zip

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 14. Verify Gradle
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          java -version

          gradle --version

      # ============================================================
      # 15. DIAGNOSTIC: VERIFY ACTUAL CMAKE FILE
      # ============================================================
      - name: Verify Sana CMake configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACTUAL SANA CMAKE FILE"
          echo "======================================"

          test -f \
            app/src/main/cpp/CMakeLists.txt

          sed -n '1,260p' \
            app/src/main/cpp/CMakeLists.txt

          echo ""
          echo "======================================"
          echo "SEARCHING REPOSITORY FOR OLD MNN PATH"
          echo "======================================"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.cxx \
            "MNN/source" \
            . || true

          echo ""
          echo "======================================"
          echo "SEARCHING NATIVE CODE FOR MNN PATHS"
          echo "======================================"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.cxx \
            "MNN" \
            app/src/main/cpp \
            || true

      # ============================================================
      # 16. FORCE CLEAN NATIVE CMAKE CACHE
      # ============================================================
      - name: Clean native CMake cache
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CLEANING NATIVE CMAKE CACHE"
          echo "======================================"

          rm -rf app/.cxx
          rm -rf app/build
          rm -rf .cxx

          echo ""
          echo "Searching for remaining CMake caches..."

          find app \
            -type d \
            \( \
              -name ".cxx" \
              -o \
              -name "cmake-build*" \
            \) \
            -print \
            || true

          echo ""
          echo "Native CMake cache cleaned."

      # ============================================================
      # 17. Build APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING SANA APK"
          echo "======================================"

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 18. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 19. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
