name: Build Sana Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Install Android SDK manually
      # --------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |

          set -e

          SDK_ROOT="$HOME/android-sdk"

          echo "Creating Android SDK at:"
          echo "$SDK_ROOT"

          mkdir -p "$SDK_ROOT"

          # Download Android command line tools
          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          mkdir -p "$SDK_ROOT/cmdline-tools"

          unzip -q commandlinetools.zip \
            -d "$SDK_ROOT/cmdline-tools"

          mv \
            "$SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          # Environment variables
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          echo "Android SDK installed."


      # --------------------------------------------------
      # 4. Verify sdkmanager
      # --------------------------------------------------
      - name: Verify sdkmanager
        shell: bash
        run: |

          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          which sdkmanager

          sdkmanager --version


      # --------------------------------------------------
      # 5. Accept licenses
      # --------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |

          yes | sdkmanager --licenses > /dev/null || true


      # --------------------------------------------------
      # 6. Install Android packages
      # --------------------------------------------------
      - name: Install Android packages
        shell: bash
        run: |

          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 7. Verify Android installation
      # --------------------------------------------------
      - name: Verify Android installation
        shell: bash
        run: |

          set -e

          echo "Installed SDK packages:"

          sdkmanager --list_installed

          echo ""
          echo "ADB:"

          adb version

          echo ""
          echo "Android 35:"

          ls -la "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Build tools:"

          ls -la "$ANDROID_HOME/build-tools/35.0.0"


      # --------------------------------------------------
      # 8. Gradle 8.9
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # --------------------------------------------------
      # 9. Verify Gradle
      # --------------------------------------------------
      - name: Gradle version
        run: |

          java -version
          gradle --version


      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 11. Check APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
