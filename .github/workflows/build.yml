name: Build Sana Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout Sana Android
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$SDK_ROOT"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          mkdir -p "$SDK_ROOT/cmdline-tools"

          unzip -q \
            commandlinetools.zip \
            -d "$SDK_ROOT/cmdline-tools"

          mv \
            "$SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # 4. Android SDK packages
      # ============================================================
      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;27.0.12077973"

      # ============================================================
      # 5. Verify toolchain
      # ============================================================
      - name: Verify native toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          "$NDK/ndk-build" --version

          test -f \
            "$NDK/build/cmake/android.toolchain.cmake"

          echo "Android CMake toolchain found."

          echo ""
          echo "======================================"
          echo "CMAKE"
          echo "======================================"

          "$CMAKE" --version

      # ============================================================
      # 6. Checkout MNN source
      # ============================================================
      - name: Checkout MNN
        shell: bash
        run: |
          set -e

          mkdir -p third_party

          git clone \
            --depth 1 \
            https://github.com/alibaba/MNN.git \
            third_party/MNN

          echo "MNN source downloaded."

          echo ""
          echo "MNN COMMIT:"
          git -C third_party/MNN rev-parse HEAD

      # ============================================================
      # 7. Prepare directories
      # ============================================================
      - name: Prepare MNN Android library directory
        shell: bash
        run: |
          set -e

          mkdir -p \
            app/src/main/jniLibs/arm64-v8a

      # ============================================================
      # 8. CACHE COMPILED MNN
      #
      # This is the important part.
      #
      # First build:
      #   MNN compiles normally.
      #
      # Later builds:
      #   libMNN.so is restored from GitHub cache.
      #
      # If MNN build settings change, change v1 -> v2.
      # ============================================================
      - name: Restore MNN native cache
        id: mnn-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libMNN.so
          key: sana-mnn-arm64-opencl-ndk27-v1

      # ============================================================
      # 9. Build MNN ONLY when cache misses
      # ============================================================
      - name: Build MNN Android
        if: steps.mnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.0.12077973"

          cd third_party/MNN

          rm -rf build_android

          mkdir -p build_android

          cd build_android

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF

          cmake --build . \
            --config Release \
            --parallel 2

      # ============================================================
      # 10. Locate and install libMNN.so
      # ============================================================
      - name: Install MNN shared library
        shell: bash
        run: |
          set -e

          DEST="app/src/main/jniLibs/arm64-v8a/libMNN.so"

          if [ -f "$DEST" ]; then
            echo "MNN cache hit."
            echo "Using cached:"
            ls -lh "$DEST"
            exit 0
          fi

          echo "Searching for compiled libMNN.so..."

          MNN_LIB="$(find third_party/MNN \
            -type f \
            -name "libMNN.so" \
            -print \
            -quit)"

          if [ -z "$MNN_LIB" ]; then
            echo "ERROR: libMNN.so was not found."
            echo ""
            echo "Available MNN libraries:"
            find third_party/MNN \
              -type f \
              \( \
                -name "libMNN.so" \
                -o \
                -name "libMNN.a" \
              \) \
              -print

            exit 1
          fi

          echo "FOUND:"
          echo "$MNN_LIB"

          cp \
            "$MNN_LIB" \
            "$DEST"

          echo ""
          echo "Installed MNN:"
          ls -lh "$DEST"

      # ============================================================
      # 11. Verify MNN
      # ============================================================
      - name: Verify MNN integration files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MNN INTEGRATION"
          echo "======================================"

          test -f \
            app/src/main/jniLibs/arm64-v8a/libMNN.so

          test -d \
            third_party/MNN/source

          echo "MNN library:"
          ls -lh \
            app/src/main/jniLibs/arm64-v8a/libMNN.so

          echo ""
          echo "MNN source:"
          du -sh third_party/MNN/source

      # ============================================================
      # 12. Install Gradle 8.9
      # ============================================================
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          cd "$HOME"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O gradle.zip

          unzip -q gradle.zip

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 13. Verify Gradle
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          java -version

          gradle --version

      # ============================================================
      # 14. Build APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 15. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 16. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
