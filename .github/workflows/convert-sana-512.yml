name: Convert Sana 0.6B 512px to MNN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sana-512-conversion
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            torch==2.6.0 \
            torchvision==0.21.0 \
            diffusers==0.35.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            onnxruntime==1.20.1 \
            onnxscript==0.1.0 \
            huggingface_hub==0.36.0 \
            numpy==1.26.4

          echo ""
          echo "=========================================="
          echo "PYTHON VERSIONS"
          echo "=========================================="

          python - <<'PY'
          import torch
          import diffusers
          import transformers
          import onnx
          import onnxruntime
          import onnxscript

          print("PyTorch:", torch.__version__)
          print("Diffusers:", diffusers.__version__)
          print("Transformers:", transformers.__version__)
          print("ONNX:", onnx.__version__)
          print("ONNX Runtime:", onnxruntime.__version__)
          print("ONNX Script:", onnxscript.__version__)
          PY

      # ============================================================
      # DOWNLOAD REAL SANA 0.6B 512PX MODEL
      # ============================================================

      - name: Download Sana 0.6B 512px
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models/sana_diffusers

          python - <<'PY'
          from huggingface_hub import snapshot_download

          repo = "Efficient-Large-Model/Sana_600M_512px_diffusers"

          print("Downloading:")
          print(repo)

          snapshot_download(
              repo_id=repo,
              local_dir="models/sana_diffusers",
              local_dir_use_symlinks=False
          )

          print("")
          print("Sana model download complete.")
          PY

          echo ""
          echo "=========================================="
          echo "DOWNLOADED MODEL SIZE"
          echo "=========================================="

          du -sh models/sana_diffusers

          echo ""
          echo "=========================================="
          echo "MODEL FILES"
          echo "=========================================="

          find models/sana_diffusers \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ============================================================
      # VERIFY MODEL STRUCTURE
      # ============================================================

      - name: Verify Sana model
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Sana model structure..."

          test -f models/sana_diffusers/model_index.json
          test -d models/sana_diffusers/transformer
          test -d models/sana_diffusers/vae
          test -d models/sana_diffusers/text_encoder
          test -d models/sana_diffusers/tokenizer
          test -d models/sana_diffusers/scheduler

          echo ""
          echo "Sana model structure OK."

          echo ""
          echo "Transformer files:"
          find models/sana_diffusers/transformer \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

          echo ""
          echo "VAE files:"
          find models/sana_diffusers/vae \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

      # ============================================================
      # CREATE EXPORT SCRIPT
      # ============================================================

      - name: Create Sana ONNX exporter
        shell: bash
        run: |
          set -euo pipefail

          cat > export_sana.py <<'PY'

          import os
          import torch

          from diffusers import SanaPipeline


          MODEL = "models/sana_diffusers"
          OUTPUT = "models/sana_onnx"


          os.makedirs(OUTPUT, exist_ok=True)


          print("")
          print("==========================================")
          print("LOADING SANA 0.6B 512PX")
          print("==========================================")


          pipe = SanaPipeline.from_pretrained(
              MODEL,
              torch_dtype=torch.float16,
              local_files_only=True,
          )


          pipe.transformer.eval()
          pipe.vae.eval()


          transformer = pipe.transformer


          print("")
          print("==========================================")
          print("SANA TRANSFORMER CONFIG")
          print("==========================================")


          print(
              "in_channels:",
              transformer.config.in_channels
          )

          print(
              "out_channels:",
              transformer.config.out_channels
          )

          print(
              "caption_channels:",
              transformer.config.caption_channels
          )

          print(
              "sample_size:",
              transformer.config.sample_size
          )

          print(
              "patch_size:",
              transformer.config.patch_size
          )

          print(
              "num_layers:",
              transformer.config.num_layers
          )


          # ========================================================
          # TRANSFORMER
          # ========================================================

          print("")
          print("==========================================")
          print("PREPARING TRANSFORMER")
          print("==========================================")


          batch = 1

          latent_h = 16
          latent_w = 16

          text_tokens = 256


          hidden_states = torch.randn(
              batch,
              transformer.config.in_channels,
              latent_h,
              latent_w,
              dtype=torch.float16,
          )


          encoder_hidden_states = torch.randn(
              batch,
              text_tokens,
              transformer.config.caption_channels,
              dtype=torch.float16,
          )


          # IMPORTANT:
          # Sana requires timestep to be a 1-D tensor.
          timestep = torch.tensor(
              [500.0],
              dtype=torch.float32,
          )


          print(
              "hidden_states:",
              tuple(hidden_states.shape)
          )

          print(
              "encoder_hidden_states:",
              tuple(encoder_hidden_states.shape)
          )

          print(
              "timestep:",
              tuple(timestep.shape)
          )


          class SanaTransformerWrapper(torch.nn.Module):

              def __init__(self, model):
                  super().__init__()
                  self.model = model


              def forward(
                  self,
                  hidden_states,
                  encoder_hidden_states,
                  timestep,
              ):

                  output = self.model(
                      hidden_states=hidden_states,
                      encoder_hidden_states=encoder_hidden_states,
                      timestep=timestep,
                      return_dict=False,
                  )

                  return output[0]


          wrapper = SanaTransformerWrapper(
              transformer
          ).eval()


          transformer_output = os.path.join(
              OUTPUT,
              "transformer.onnx"
          )


          print("")
          print("==========================================")
          print("EXPORTING SANA TRANSFORMER")
          print("==========================================")


          with torch.no_grad():

              torch.onnx.export(
                  wrapper,
                  (
                      hidden_states,
                      encoder_hidden_states,
                      timestep,
                  ),
                  transformer_output,

                  input_names=[
                      "hidden_states",
                      "encoder_hidden_states",
                      "timestep",
                  ],

                  output_names=[
                      "sample",
                  ],

                  opset_version=17,

                  dynamo=True,

                  external_data=True,

                  optimize=True,
              )


          print("")
          print("Transformer export complete.")

          print(
              "Transformer ONNX:",
              transformer_output
          )


          # ========================================================
          # VAE DECODER
          # ========================================================

          print("")
          print("==========================================")
          print("PREPARING VAE DECODER")
          print("==========================================")


          vae = pipe.vae

          vae.eval()


          class VAEDecoder(torch.nn.Module):

              def __init__(self, model):
                  super().__init__()
                  self.model = model


              def forward(self, latents):

                  output = self.model.decode(
                      latents,
                      return_dict=False,
                  )

                  return output[0]


          decoder = VAEDecoder(
              vae
          ).eval()


          latent_channels = 32


          latent = torch.randn(
              1,
              latent_channels,
              16,
              16,
              dtype=torch.float32,
          )


          decoder_output = os.path.join(
              OUTPUT,
              "vae_decoder.onnx"
          )


          print(
              "latent:",
              tuple(latent.shape)
          )


          print("")
          print("==========================================")
          print("EXPORTING VAE DECODER")
          print("==========================================")


          with torch.no_grad():

              torch.onnx.export(
                  decoder,
                  (latent,),
                  decoder_output,

                  input_names=[
                      "latent",
                  ],

                  output_names=[
                      "image",
                  ],

                  opset_version=17,

                  dynamo=True,

                  external_data=True,

                  optimize=True,
              )


          print("")
          print("VAE decoder export complete.")

          print(
              "VAE ONNX:",
              decoder_output
          )


          # ========================================================
          # FINAL EXPORT REPORT
          # ========================================================

          print("")
          print("==========================================")
          print("ONNX EXPORT COMPLETE")
          print("==========================================")


          for root, _, files in os.walk(OUTPUT):

              for name in sorted(files):

                  path = os.path.join(
                      root,
                      name
                  )

                  print(
                      path,
                      os.path.getsize(path),
                      "bytes"
                  )

          PY

      # ============================================================
      # EXPORT REAL ONNX MODELS
      # ============================================================

      - name: Export Sana Transformer and VAE
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "STARTING ONNX EXPORT"
          echo "=========================================="

          python export_sana.py

          echo ""
          echo "=========================================="
          echo "ONNX OUTPUT"
          echo "=========================================="

          find models/sana_onnx \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo ""
          echo "TOTAL ONNX SIZE:"
          du -sh models/sana_onnx

          echo ""
          echo "Checking required files..."

          test -f models/sana_onnx/transformer.onnx
          test -f models/sana_onnx/vae_decoder.onnx

          echo "Required ONNX files found."

      # ============================================================
      # VALIDATE ONNX
      # ============================================================

      - name: Validate ONNX models
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'

          import os
          import onnx


          root = "models/sana_onnx"


          files = []


          for base, _, names in os.walk(root):

              for name in names:

                  if name.endswith(".onnx"):

                      files.append(
                          os.path.join(
                              base,
                              name
                          )
                      )


          if not files:
              raise RuntimeError(
                  "No ONNX files found."
              )


          print(
              "Found",
              len(files),
              "ONNX files."
          )


          for path in sorted(files):

              print("")
              print("Checking:")
              print(path)

              model = onnx.load(
                  path,
                  load_external_data=False
              )

              onnx.checker.check_model(
                  model
              )

              print("VALID")


          print("")
          print("All ONNX graphs passed validation.")

          PY

      # ============================================================
      # CHECKOUT MNN
      # ============================================================

      - name: Checkout MNN
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/alibaba/MNN.git \
            third_party/MNN

          echo ""
          echo "MNN commit:"
          git -C third_party/MNN rev-parse HEAD

      # ============================================================
      # BUILD MNN CONVERTER
      # ============================================================

      - name: Build MNNConvert
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/MNN

          rm -rf build_converter

          mkdir build_converter

          cd build_converter

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF \
            -DMNN_SEP_BUILD=OFF

          cmake --build . \
            --target MNNConvert \
            --parallel 2

          test -x MNNConvert

          echo ""
          echo "MNNConvert successfully built."

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================

      - name: Prepare MNN output
        shell: bash
        run: |
          set -euo pipefail

          rm -rf models/sana_mnn

          mkdir -p models/sana_mnn

      # ============================================================
      # CONVERT TRANSFORMER
      # ============================================================

      - name: Convert Sana Transformer to MNN
        shell: bash
        run: |
          set -euo pipefail

          MNN="third_party/MNN/build_converter/MNNConvert"

          ONNX="models/sana_onnx/transformer.onnx"

          OUTPUT="models/sana_mnn/transformer.mnn"


          test -f "$ONNX"


          echo ""
          echo "=========================================="
          echo "CONVERTING TRANSFORMER"
          echo "=========================================="


          "$MNN" \
            -f ONNX \
            --modelFile "$ONNX" \
            --MNNModel "$OUTPUT" \
            --fp16 \
            --optimizePrefer=2


          test -f "$OUTPUT"


          echo ""
          echo "Transformer MNN created:"

          ls -lh "$OUTPUT"

      # ============================================================
      # CONVERT VAE
      # ============================================================

      - name: Convert Sana VAE Decoder to MNN
        shell: bash
        run: |
          set -euo pipefail

          MNN="third_party/MNN/build_converter/MNNConvert"

          ONNX="models/sana_onnx/vae_decoder.onnx"

          OUTPUT="models/sana_mnn/vae_decoder.mnn"


          test -f "$ONNX"


          echo ""
          echo "=========================================="
          echo "CONVERTING VAE DECODER"
          echo "=========================================="


          "$MNN" \
            -f ONNX \
            --modelFile "$ONNX" \
            --MNNModel "$OUTPUT" \
            --fp16 \
            --optimizePrefer=2


          test -f "$OUTPUT"


          echo ""
          echo "VAE decoder MNN created:"

          ls -lh "$OUTPUT"

      # ============================================================
      # COPY CONFIGURATION
      # ============================================================

      - name: Copy Sana runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          cp \
            models/sana_diffusers/model_index.json \
            models/sana_mnn/model_index.json


          cp \
            models/sana_diffusers/scheduler/scheduler_config.json \
            models/sana_mnn/scheduler_config.json


          cp \
            models/sana_diffusers/transformer/config.json \
            models/sana_mnn/transformer_config.json


          cp \
            models/sana_diffusers/vae/config.json \
            models/sana_mnn/vae_config.json


          echo "Runtime configuration copied."

      # ============================================================
      # CREATE MANIFEST
      # ============================================================

      - name: Create model manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'

          import hashlib
          import json
          import os


          root = "models/sana_mnn"


          files = []


          for base, _, names in os.walk(root):

              for name in names:

                  path = os.path.join(
                      base,
                      name
                  )


                  sha = hashlib.sha256()


                  with open(
                      path,
                      "rb"
                  ) as f:

                      while True:

                          chunk = f.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          sha.update(chunk)


                  files.append({
                      "path": os.path.relpath(
                          path,
                          root
                      ),
                      "bytes": os.path.getsize(
                          path
                      ),
                      "sha256": sha.hexdigest()
                  })


          manifest = {
              "model": "Sana-0.6B",
              "resolution": "512x512",
              "parameters": "590M",
              "source":
                  "Efficient-Large-Model/"
                  "Sana_600M_512px_diffusers",
              "runtime": "MNN",
              "transformer_precision": "fp16",
              "files": sorted(
                  files,
                  key=lambda x: x["path"]
              )
          }


          output = os.path.join(
              root,
              "manifest.json"
          )


          with open(
              output,
              "w"
          ) as f:

              json.dump(
                  manifest,
                  f,
                  indent=2
              )


          print("")
          print(
              json.dumps(
                  manifest,
                  indent=2
              )
          )

          PY

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate final MNN model
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "FINAL SANA MNN MODEL"
          echo "=========================================="


          test -f \
            models/sana_mnn/transformer.mnn


          test -f \
            models/sana_mnn/vae_decoder.mnn


          echo ""
          echo "MNN files:"

          find models/sana_mnn \
            -type f \
            -printf '%p %s bytes\n' \
            | sort


          echo ""
          echo "=========================================="
          echo "TRANSFORMER SIZE"
          echo "=========================================="


          ls -lh \
            models/sana_mnn/transformer.mnn


          echo ""
          echo "=========================================="
          echo "VAE SIZE"
          echo "=========================================="


          ls -lh \
            models/sana_mnn/vae_decoder.mnn


          echo ""
          echo "=========================================="
          echo "TOTAL MODEL SIZE"
          echo "=========================================="


          du -sh \
            models/sana_mnn

      # ============================================================
      # UPLOAD ACTUAL MODEL
      # ============================================================

      - name: Upload Sana MNN model
        uses: actions/upload-artifact@v4
        with:
          name: Sana-0.6B-512-MNN-REAL
          path: models/sana_mnn/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
