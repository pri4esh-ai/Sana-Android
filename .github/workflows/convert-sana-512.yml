name: Convert Sana 0.6B 512px to MNN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            build-essential \
            cmake \
            ninja-build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            diffusers==0.35.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            onnxruntime==1.20.1 \
            huggingface_hub==0.36.0 \
            numpy==1.26.4

      # ------------------------------------------------------------
      # Download the REAL official Sana 0.6B / 512px model
      # ------------------------------------------------------------

      - name: Download official Sana 0.6B 512px
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          repo = "Efficient-Large-Model/Sana_600M_512px_diffusers"

          print("Downloading:", repo)

          path = snapshot_download(
              repo_id=repo,
              local_dir="sana_model",
              local_dir_use_symlinks=False
          )

          print("Model downloaded to:", path)
          PY

      - name: Verify Sana model
        run: |
          echo "===== Sana model tree ====="
          find sana_model -maxdepth 2 -type f | sort | head -300

          echo ""
          echo "===== Required directories ====="

          test -d sana_model/transformer
          test -d sana_model/vae
          test -d sana_model/text_encoder
          test -d sana_model/tokenizer
          test -d sana_model/scheduler

          echo "All required Sana components found."

      # ------------------------------------------------------------
      # Export Transformer + VAE to ONNX
      # ------------------------------------------------------------

      - name: Create Sana ONNX exporter
        run: |
          cat > export_sana.py <<'PY'
          import os
          import sys
          import traceback

          import torch
          import onnx

          from diffusers import SanaTransformer2DModel, AutoencoderDC


          MODEL_DIR = "sana_model"
          OUTPUT_DIR = "onnx"

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          print("=" * 70)
          print("SANA 0.6B 512px ONNX EXPORT")
          print("=" * 70)

          print("PyTorch:", torch.__version__)
          print("ONNX:", onnx.__version__)

          device = torch.device("cpu")

          # ----------------------------------------------------------
          # Transformer
          # ----------------------------------------------------------

          print("")
          print("=" * 70)
          print("Loading Sana Transformer")
          print("=" * 70)

          transformer_path = os.path.join(
              MODEL_DIR,
              "transformer"
          )

          transformer = SanaTransformer2DModel.from_pretrained(
              transformer_path,
              torch_dtype=torch.float32
          )

          transformer.eval()
          transformer.to(device)

          print("")
          print("Transformer configuration:")
          print("in_channels:", transformer.config.in_channels)
          print("out_channels:", transformer.config.out_channels)
          print("caption_channels:", transformer.config.caption_channels)
          print("sample_size:", transformer.config.sample_size)
          print("patch_size:", transformer.config.patch_size)
          print("num_layers:", transformer.config.num_layers)

          # ----------------------------------------------------------
          # Wrapper
          #
          # The explicit 1D timestep avoids:
          # "Timesteps should be a 1d-array"
          # ----------------------------------------------------------

          class SanaTransformerWrapper(torch.nn.Module):

              def __init__(self, model):
                  super().__init__()
                  self.model = model

              def forward(
                  self,
                  hidden_states,
                  encoder_hidden_states,
                  timestep
              ):
                  timestep = timestep.reshape(-1).to(
                      dtype=torch.float32
                  )

                  result = self.model(
                      hidden_states=hidden_states,
                      encoder_hidden_states=encoder_hidden_states,
                      timestep=timestep,
                      return_dict=False,
                  )

                  return result[0]


          wrapper = SanaTransformerWrapper(transformer)
          wrapper.eval()

          # ----------------------------------------------------------
          # Fixed 512px Sana latent dimensions
          #
          # 512 / 32 = 16
          #
          # Sana transformer:
          # [1, 32, 16, 16]
          #
          # Gemma conditioning:
          # [1, 256, 2304]
          # ----------------------------------------------------------

          hidden_states = torch.randn(
              1,
              32,
              16,
              16,
              dtype=torch.float32,
              device=device
          )

          encoder_hidden_states = torch.randn(
              1,
              256,
              2304,
              dtype=torch.float32,
              device=device
          )

          timestep = torch.tensor(
              [500.0],
              dtype=torch.float32,
              device=device
          )

          transformer_output = os.path.join(
              OUTPUT_DIR,
              "sana_transformer.onnx"
          )

          print("")
          print("=" * 70)
          print("Exporting Transformer")
          print("=" * 70)

          with torch.no_grad():

              torch.onnx.export(
                  wrapper,
                  (
                      hidden_states,
                      encoder_hidden_states,
                      timestep,
                  ),
                  transformer_output,

                  input_names=[
                      "hidden_states",
                      "encoder_hidden_states",
                      "timestep",
                  ],

                  output_names=[
                      "sample",
                  ],

                  opset_version=17,

                  do_constant_folding=True,

                  external_data=True,

                  verbose=False,
              )

          print("")
          print("Transformer ONNX created:")
          print(transformer_output)

          # ----------------------------------------------------------
          # Validate Transformer ONNX
          # ----------------------------------------------------------

          print("")
          print("Checking Transformer ONNX...")

          transformer_onnx = onnx.load(
              transformer_output,
              load_external_data=False
          )

          onnx.checker.check_model(
              transformer_onnx,
              full_check=False
          )

          print("Transformer ONNX CHECK: OK")

          # ----------------------------------------------------------
          # VAE
          # ----------------------------------------------------------

          print("")
          print("=" * 70)
          print("Loading Sana VAE")
          print("=" * 70)

          vae_path = os.path.join(
              MODEL_DIR,
              "vae"
          )

          vae = AutoencoderDC.from_pretrained(
              vae_path,
              torch_dtype=torch.float32
          )

          vae.eval()
          vae.to(device)

          print("VAE loaded.")

          # ----------------------------------------------------------
          # Decoder wrapper
          # ----------------------------------------------------------

          class SanaVAEDecoder(torch.nn.Module):

              def __init__(self, model):
                  super().__init__()
                  self.model = model

              def forward(self, latent):
                  result = self.model.decode(
                      latent,
                      return_dict=False
                  )

                  return result[0]


          decoder = SanaVAEDecoder(vae)
          decoder.eval()

          # Sana latent for 512px image
          latent = torch.randn(
              1,
              32,
              16,
              16,
              dtype=torch.float32,
              device=device
          )

          decoder_output = os.path.join(
              OUTPUT_DIR,
              "sana_vae_decoder.onnx"
          )

          print("")
          print("=" * 70)
          print("Exporting VAE Decoder")
          print("=" * 70)

          with torch.no_grad():

              torch.onnx.export(
                  decoder,
                  (
                      latent,
                  ),
                  decoder_output,

                  input_names=[
                      "latent",
                  ],

                  output_names=[
                      "image",
                  ],

                  opset_version=17,

                  do_constant_folding=True,

                  external_data=True,

                  verbose=False,
              )

          print("")
          print("VAE ONNX created:")
          print(decoder_output)

          # ----------------------------------------------------------
          # Validate VAE
          # ----------------------------------------------------------

          print("")
          print("Checking VAE ONNX...")

          vae_onnx = onnx.load(
              decoder_output,
              load_external_data=False
          )

          onnx.checker.check_model(
              vae_onnx,
              full_check=False
          )

          print("VAE ONNX CHECK: OK")

          # ----------------------------------------------------------
          # Final output listing
          # ----------------------------------------------------------

          print("")
          print("=" * 70)
          print("ONNX EXPORT COMPLETE")
          print("=" * 70)

          for root, dirs, files in os.walk(OUTPUT_DIR):

              for filename in sorted(files):

                  path = os.path.join(
                      root,
                      filename
                  )

                  size = os.path.getsize(path)

                  print(
                      f"{path}: "
                      f"{size / (1024 * 1024):.2f} MB"
                  )

          PY

      - name: Export Sana to ONNX
        run: |
          python export_sana.py

      # ------------------------------------------------------------
      # Clone MNN
      # ------------------------------------------------------------

      - name: Clone MNN
        run: |
          git clone --depth 1 \
            https://github.com/alibaba/MNN.git \
            MNN

      # ------------------------------------------------------------
      # Build MNN converter
      # ------------------------------------------------------------

      - name: Build MNN converter
        run: |
          cd MNN

          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF

          cmake --build . \
            --target MNNConvert \
            -j2

          echo ""
          echo "===== MNNConvert ====="
          find . -type f -name "MNNConvert" -print

      # ------------------------------------------------------------
      # Convert Transformer ONNX -> MNN
      # ------------------------------------------------------------

      - name: Convert Sana Transformer to MNN
        run: |
          mkdir -p mnn_models

          MNN_CONVERT=$(find MNN/build -type f -name MNNConvert | head -1)

          if [ -z "$MNN_CONVERT" ]; then
            echo "ERROR: MNNConvert not found"
            exit 1
          fi

          echo "Using:"
          echo "$MNN_CONVERT"

          "$MNN_CONVERT" \
            -f ONNX \
            --modelFile onnx/sana_transformer.onnx \
            --MNNModel mnn_models/sana_transformer.mnn \
            --fp16 \
            --optimizePrefer=2

      # ------------------------------------------------------------
      # Convert VAE ONNX -> MNN
      # ------------------------------------------------------------

      - name: Convert Sana VAE to MNN
        run: |
          mkdir -p mnn_models

          MNN_CONVERT=$(find MNN/build -type f -name MNNConvert | head -1)

          if [ -z "$MNN_CONVERT" ]; then
            echo "ERROR: MNNConvert not found"
            exit 1
          fi

          "$MNN_CONVERT" \
            -f ONNX \
            --modelFile onnx/sana_vae_decoder.onnx \
            --MNNModel mnn_models/sana_vae_decoder.mnn \
            --fp16 \
            --optimizePrefer=2

      # ------------------------------------------------------------
      # Copy configuration files needed later by Android
      # ------------------------------------------------------------

      - name: Copy Sana configuration
        run: |
          mkdir -p mnn_models/config

          cp -r sana_model/transformer/config.json \
            mnn_models/config/transformer_config.json

          cp -r sana_model/vae/config.json \
            mnn_models/config/vae_config.json

          cp -r sana_model/scheduler \
            mnn_models/config/scheduler

          echo ""
          echo "===== MNN model files ====="
          find mnn_models -type f -printf "%p %k KB\n" | sort

      # ------------------------------------------------------------
      # Generate manifest
      # ------------------------------------------------------------

      - name: Generate model manifest
        run: |
          cat > mnn_models/MODEL_INFO.txt <<'EOF'
          Sana Android Model Package
          ===========================

          Model:
          Efficient-Large-Model/Sana_600M_512px_diffusers

          Architecture:
          Sana 0.6B

          Resolution:
          512x512

          Transformer:
          sana_transformer.mnn

          VAE:
          sana_vae_decoder.mnn

          Runtime:
          Alibaba MNN

          Target:
          Android ARM64

          Backend:
          OpenCL / ARM82 / FP16

          Latent:
          1 x 32 x 16 x 16

          Transformer conditioning:
          1 x 256 x 2304

          IMPORTANT:
          This package contains the Sana transformer and VAE.
          The official Sana pipeline also uses the Gemma2-2B-IT
          text encoder for text conditioning.

          The Android application must integrate the text encoder
          separately before arbitrary text-to-image generation
          is complete.
          EOF

          echo ""
          cat mnn_models/MODEL_INFO.txt

      # ------------------------------------------------------------
      # Final size check
      # ------------------------------------------------------------

      - name: Final model size
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL SANA MNN PACKAGE"
          echo "=========================================="

          du -sh mnn_models

          echo ""
          find mnn_models \
            -type f \
            -printf "%s bytes  %p\n" \
            | sort -nr

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------

      - name: Upload Sana MNN package
        uses: actions/upload-artifact@v4
        with:
          name: Sana-0.6B-512-MNN-REAL
          path: mnn_models/
          if-no-files-found: error
          retention-days: 7
