name: Convert Sana 0.6B 512px to MNN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sana-512-conversion
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ------------------------------------------------------------
      # PYTORCH / DIFFUSERS / ONNX
      # ------------------------------------------------------------

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            diffusers==0.35.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            onnxruntime==1.20.1 \
            huggingface_hub==0.36.0 \
            numpy==1.26.4

      # ------------------------------------------------------------
      # DOWNLOAD THE REAL SANA MODEL
      # ------------------------------------------------------------

      - name: Download Sana 0.6B 512px
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models/sana_diffusers

          python - <<'PY'
          from huggingface_hub import snapshot_download

          repo = "Efficient-Large-Model/Sana_600M_512px_diffusers"

          snapshot_download(
              repo_id=repo,
              local_dir="models/sana_diffusers",
              local_dir_use_symlinks=False
          )

          print("Sana model downloaded.")
          PY

          echo ""
          echo "=========================================="
          echo "SANA MODEL SIZE"
          echo "=========================================="

          du -sh models/sana_diffusers

          echo ""
          echo "=========================================="
          echo "SANA MODEL FILES"
          echo "=========================================="

          find models/sana_diffusers \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ------------------------------------------------------------
      # VERIFY MODEL
      # ------------------------------------------------------------

      - name: Verify Sana model structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Sana model..."

          test -f models/sana_diffusers/model_index.json
          test -d models/sana_diffusers/transformer
          test -d models/sana_diffusers/vae
          test -d models/sana_diffusers/text_encoder
          test -d models/sana_diffusers/tokenizer
          test -d models/sana_diffusers/scheduler

          echo "Sana model structure verified."

          echo ""
          echo "Transformer:"
          find models/sana_diffusers/transformer \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

          echo ""
          echo "VAE:"
          find models/sana_diffusers/vae \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

      # ------------------------------------------------------------
      # DOWNLOAD ONNX EXPORTER
      # ------------------------------------------------------------

      - name: Install ONNX export tools
        shell: bash
        run: |
          set -euo pipefail

          pip install \
            optimum==1.23.3 \
            onnxscript==0.1.0

      # ------------------------------------------------------------
      # CREATE EXPORT SCRIPT
      # ------------------------------------------------------------

      - name: Create Sana ONNX exporter
        shell: bash
        run: |
          set -euo pipefail

          cat > export_sana.py <<'PY'
          import os
          import torch

          from diffusers import SanaPipeline

          MODEL = "models/sana_diffusers"
          OUTPUT = "models/sana_onnx"

          os.makedirs(OUTPUT, exist_ok=True)

          print("Loading Sana 0.6B 512px...")

          pipe = SanaPipeline.from_pretrained(
              MODEL,
              torch_dtype=torch.float16,
              variant="fp16",
              local_files_only=True,
          )

          print("Pipeline loaded.")

          transformer = pipe.transformer
          vae = pipe.vae

          # --------------------------------------------------------
          # Transformer
          # --------------------------------------------------------

          print("Preparing transformer...")

          transformer.eval()

          dummy_hidden = torch.randn(
              1,
              256,
              transformer.config.caption_channels,
              dtype=torch.float16
          )

          dummy_sample = torch.randn(
              1,
              transformer.config.in_channels,
              16,
              16,
              dtype=torch.float16
          )

          dummy_timestep = torch.tensor(
              [1.0],
              dtype=torch.float32
          )

          transformer_output = os.path.join(
              OUTPUT,
              "transformer.onnx"
          )

          print("Exporting transformer...")

          torch.onnx.export(
              transformer,
              (
                  dummy_sample,
                  dummy_timestep,
                  dummy_hidden,
              ),
              transformer_output,
              input_names=[
                  "sample",
                  "timestep",
                  "encoder_hidden_states",
              ],
              output_names=[
                  "output",
              ],
              opset_version=17,
              do_constant_folding=True,
              external_data=True,
          )

          print("Transformer exported.")

          # --------------------------------------------------------
          # VAE DECODER
          # --------------------------------------------------------

          print("Preparing VAE decoder...")

          vae.eval()

          latent = torch.randn(
              1,
              32,
              16,
              16,
              dtype=torch.float32
          )

          decoder_output = os.path.join(
              OUTPUT,
              "vae_decoder.onnx"
          )

          class VAEDecoder(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model

              def forward(self, latents):
                  return self.model.decode(latents).sample

          decoder = VAEDecoder(vae)

          print("Exporting VAE decoder...")

          torch.onnx.export(
              decoder,
              (latent,),
              decoder_output,
              input_names=["latent"],
              output_names=["image"],
              opset_version=17,
              do_constant_folding=True,
              external_data=True,
          )

          print("VAE decoder exported.")

          print("==========================================")
          print("EXPORT COMPLETE")
          print("==========================================")

          for root, _, files in os.walk(OUTPUT):
              for name in files:
                  print(os.path.join(root, name))
          PY

      # ------------------------------------------------------------
      # EXPORT REAL ONNX MODELS
      # ------------------------------------------------------------

      - name: Export Sana Transformer and VAE
        shell: bash
        env:
          PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        run: |
          set -euo pipefail

          python export_sana.py

          echo ""
          echo "=========================================="
          echo "ONNX OUTPUT"
          echo "=========================================="

          find models/sana_onnx \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo ""
          du -sh models/sana_onnx

      # ------------------------------------------------------------
      # INSTALL MNN
      # ------------------------------------------------------------

      - name: Checkout MNN
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/alibaba/MNN.git \
            third_party/MNN

      # ------------------------------------------------------------
      # BUILD MNN CONVERTER
      # ------------------------------------------------------------

      - name: Build MNNConvert
        shell: bash
        run: |
          set -euo pipefail

          cd third_party/MNN

          mkdir -p build_converter

          cd build_converter

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF \
            -DMNN_SEP_BUILD=OFF

          cmake --build . \
            --target MNNConvert \
            --parallel 2

          test -x MNNConvert

          echo "MNNConvert built successfully."

      # ------------------------------------------------------------
      # PREPARE MNN OUTPUT
      # ------------------------------------------------------------

      - name: Prepare MNN model directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models/sana_mnn

      # ------------------------------------------------------------
      # CONVERT TRANSFORMER
      # ------------------------------------------------------------

      - name: Convert Sana Transformer to MNN
        shell: bash
        run: |
          set -euo pipefail

          MNN="third_party/MNN/build_converter/MNNConvert"

          test -f models/sana_onnx/transformer.onnx

          "$MNN" \
            -f ONNX \
            --modelFile models/sana_onnx/transformer.onnx \
            --MNNModel models/sana_mnn/transformer.mnn \
            --fp16 \
            --optimizePrefer=2

          test -f models/sana_mnn/transformer.mnn

          echo "Transformer MNN created:"
          ls -lh models/sana_mnn/transformer.mnn

      # ------------------------------------------------------------
      # CONVERT VAE DECODER
      # ------------------------------------------------------------

      - name: Convert VAE Decoder to MNN
        shell: bash
        run: |
          set -euo pipefail

          MNN="third_party/MNN/build_converter/MNNConvert"

          test -f models/sana_onnx/vae_decoder.onnx

          "$MNN" \
            -f ONNX \
            --modelFile models/sana_onnx/vae_decoder.onnx \
            --MNNModel models/sana_mnn/vae_decoder.mnn \
            --fp16 \
            --optimizePrefer=2

          test -f models/sana_mnn/vae_decoder.mnn

          echo "VAE decoder MNN created:"
          ls -lh models/sana_mnn/vae_decoder.mnn

      # ------------------------------------------------------------
      # COPY RUNTIME CONFIGURATION
      # ------------------------------------------------------------

      - name: Copy Sana runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          cp models/sana_diffusers/model_index.json \
             models/sana_mnn/

          cp models/sana_diffusers/scheduler/scheduler_config.json \
             models/sana_mnn/

          cp models/sana_diffusers/transformer/config.json \
             models/sana_mnn/transformer_config.json

          cp models/sana_diffusers/vae/config.json \
             models/sana_mnn/vae_config.json

      # ------------------------------------------------------------
      # CREATE MANIFEST
      # ------------------------------------------------------------

      - name: Create model manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os

          root = "models/sana_mnn"

          files = []

          for base, _, names in os.walk(root):
              for name in names:

                  path = os.path.join(base, name)

                  h = hashlib.sha256()

                  with open(path, "rb") as f:
                      while True:
                          data = f.read(1024 * 1024)

                          if not data:
                              break

                          h.update(data)

                  files.append({
                      "path": os.path.relpath(path, root),
                      "bytes": os.path.getsize(path),
                      "sha256": h.hexdigest()
                  })

          manifest = {
              "model": "Sana-0.6B",
              "resolution": "512x512",
              "parameters": "590M",
              "source": "Efficient-Large-Model/Sana_600M_512px_diffusers",
              "transformer_precision": "fp16",
              "runtime": "MNN",
              "files": sorted(
                  files,
                  key=lambda x: x["path"]
              )
          }

          with open(
              os.path.join(
                  root,
                  "manifest.json"
              ),
              "w"
          ) as f:
              json.dump(
                  manifest,
                  f,
                  indent=2
              )

          print(
              json.dumps(
                  manifest,
                  indent=2
              )
          )
          PY

      # ------------------------------------------------------------
      # FINAL VALIDATION
      # ------------------------------------------------------------

      - name: Validate real MNN model
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL SANA MNN MODEL"
          echo "=========================================="

          test -f models/sana_mnn/transformer.mnn
          test -f models/sana_mnn/vae_decoder.mnn

          echo ""
          echo "Files:"
          find models/sana_mnn \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo ""
          echo "TOTAL SIZE:"
          du -sh models/sana_mnn

          echo ""
          echo "TRANSFORMER:"
          ls -lh models/sana_mnn/transformer.mnn

          echo ""
          echo "VAE:"
          ls -lh models/sana_mnn/vae_decoder.mnn

      # ------------------------------------------------------------
      # UPLOAD REAL MODEL
      # ------------------------------------------------------------

      - name: Upload REAL Sana MNN model
        uses: actions/upload-artifact@v4
        with:
          name: Sana-0.6B-512-MNN-REAL
          path: models/sana_mnn/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
