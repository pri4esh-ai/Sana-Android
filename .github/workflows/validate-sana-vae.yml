name: Validate Sana VAE Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vae:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip build-essential cmake ninja-build zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            diffusers==0.35.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            onnxruntime==1.20.1 \
            huggingface_hub==0.36.0 \
            numpy==1.26.4

      - name: Download official Sana 0.6B 512px
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="Efficient-Large-Model/Sana_600M_512px_diffusers",
              local_dir="sana_model",
              local_dir_use_symlinks=False
          )
          print("Sana download: PASS")
          PY

      - name: Verify VAE
        run: |
          test -d sana_model/vae
          test -f sana_model/vae/config.json
          test -d sana_model/scheduler
          test -f sana_model/scheduler/scheduler_config.json
          echo "VAE: PASS"
          echo "Scheduler: PASS"

      - name: Create VAE exporter
        run: |
          cat > export_vae.py <<'PY'
          import os
          import torch
          import onnx
          from diffusers import AutoencoderDC

          MODEL_DIR = "sana_model/vae"
          OUTPUT_DIR = "onnx"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          print("=" * 70)
          print("SANA 0.6B / 512px VAE VALIDATION")
          print("=" * 70)
          print("PyTorch:", torch.__version__)
          print("ONNX:", onnx.__version__)

          print("\nLOADING AutoencoderDC")
          vae = AutoencoderDC.from_pretrained(
              MODEL_DIR,
              torch_dtype=torch.float32
          )
          vae.eval()
          vae.to("cpu")
          print("VAE loaded: PASS")

          print("\nVAE CONFIG")
          print("in_channels:", vae.config.in_channels)
          print("latent_channels:", vae.config.latent_channels)
          print("scaling_factor:", vae.config.scaling_factor)
          print("decoder_block_out_channels:", vae.config.decoder_block_out_channels)
          print("decoder_block_types:", vae.config.decoder_block_types)

          class SanaVAEDecoder(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model

              def forward(self, latent):
                  return self.model.decode(
                      latent,
                      return_dict=False
                  )[0]

          decoder = SanaVAEDecoder(vae)
          decoder.eval()

          latent = torch.randn(
              1, 32, 16, 16,
              dtype=torch.float32
          )

          expected = [1, 3, 512, 512]

          print("\nPYTORCH TEST")
          with torch.no_grad():
              pytorch_output = decoder(latent)

          print("Input:", list(latent.shape))
          print("Output:", list(pytorch_output.shape))
          print("Min:", float(pytorch_output.min()))
          print("Max:", float(pytorch_output.max()))

          if list(pytorch_output.shape) != expected:
              raise RuntimeError(
                  f"Unexpected PyTorch output: {list(pytorch_output.shape)}"
              )

          print("PyTorch VAE: PASS")

          raw_path = "onnx/sana_vae_decoder.onnx"

          print("\nEXPORTING ONNX")
          with torch.no_grad():
              torch.onnx.export(
                  decoder,
                  (latent,),
                  raw_path,
                  input_names=["latent"],
                  output_names=["image"],
                  opset_version=17,
                  do_constant_folding=False,
                  external_data=True,
                  verbose=False
              )

          print("ONNX export: PASS")

          model = onnx.load(
              raw_path,
              load_external_data=True
          )

          onnx.checker.check_model(model)
          print("Raw ONNX checker: PASS")

          print("\nREPAIRING TRANSPOSE NODES")

          patched = 0

          for node in model.graph.node:
              if node.op_type != "Transpose":
                  continue

              for attr in node.attribute:
                  if attr.name != "perm":
                      continue

                  perm = list(attr.ints)

                  if any(v < 0 for v in perm):
                      rank = len(perm)
                      fixed = [
                          rank + v if v < 0 else v
                          for v in perm
                      ]

                      if sorted(fixed) != list(range(rank)):
                          raise RuntimeError(
                              f"Unsafe Transpose permutation: {perm}"
                          )

                      print(
                          "PATCH:",
                          node.name,
                          perm,
                          "->",
                          fixed
                      )

                      attr.ints[:] = fixed
                      patched += 1

          print("Patched Transpose nodes:", patched)

          final_path = "onnx/sana_vae_decoder_final.onnx"

          onnx.save(
              model,
              final_path
          )

          final_model = onnx.load(
              final_path,
              load_external_data=True
          )

          onnx.checker.check_model(final_model)

          print("Final ONNX checker: PASS")

          bad = 0

          for node in final_model.graph.node:
              if node.op_type != "Transpose":
                  continue

              for attr in node.attribute:
                  if attr.name == "perm":
                      perm = list(attr.ints)
                      if any(v < 0 for v in perm):
                          bad += 1

          if bad:
              raise RuntimeError(
                  f"{bad} invalid Transpose nodes remain"
              )

          print("Transpose validation: PASS")

          print("\nEXPORT VALIDATION COMPLETE")
          print("PyTorch: PASS")
          print("ONNX: PASS")
          print("Transpose repair: PASS")
          print("Ready for MNN")
          PY

      - name: Export and validate VAE
        run: |
          python export_vae.py

      - name: Clone MNN
        run: |
          git clone --depth 1 https://github.com/alibaba/MNN.git MNN

      - name: Build MNN converter
        run: |
          mkdir -p MNN/build
          cd MNN/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_BUILD_TRANSFORMER_FUSE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF
          cmake --build . --target MNNConvert -j2
          echo "MNNConvert build: PASS"

      - name: Locate MNNConvert
        run: |
          MNN_CONVERT=$(find MNN/build -type f -name MNNConvert | head -1)
          test -n "$MNN_CONVERT"
          echo "$MNN_CONVERT" > mnn_converter_path.txt
          echo "MNNConvert: $MNN_CONVERT"

      - name: Convert VAE to MNN FP32
        run: |
          mkdir -p mnn_models
          MNN_CONVERT=$(cat mnn_converter_path.txt)

          echo "Converting Sana VAE to MNN FP32..."

          "$MNN_CONVERT" \
            -f ONNX \
            --modelFile onnx/sana_vae_decoder_final.onnx \
            --MNNModel mnn_models/sana_vae_decoder_fp32.mnn \
            --optimizePrefer=2

          test -s mnn_models/sana_vae_decoder_fp32.mnn
          ls -lh mnn_models/sana_vae_decoder_fp32.mnn
          echo "MNN FP32 conversion: PASS"

      - name: Create MNN CPU test
        run: |
          cat > test_mnn_vae.cpp <<'CPP'
          #include <MNN/Interpreter.hpp>
          #include <MNN/Tensor.hpp>
          #include <algorithm>
          #include <iostream>

          int main(int argc, char** argv) {
              if (argc < 2) {
                  std::cerr << "Usage: test_mnn_vae <model.mnn>\n";
                  return 1;
              }

              const char* modelPath = argv[1];

              std::cout << "============================================================\n";
              std::cout << "MNN VAE CPU TEST\n";
              std::cout << "============================================================\n";
              std::cout << "Model: " << modelPath << "\n";

              auto interpreter =
                  MNN::Interpreter::createFromFile(modelPath);

              if (!interpreter) {
                  std::cerr << "Interpreter: FAIL\n";
                  return 2;
              }

              std::cout << "Interpreter: PASS\n";

              MNN::ScheduleConfig config;
              config.type = MNN_FORWARD_CPU;
              config.numThread = 2;

              auto session =
                  interpreter->createSession(config);

              if (!session) {
                  std::cerr << "CPU session: FAIL\n";
                  MNN::Interpreter::destroy(interpreter);
                  return 3;
              }

              std::cout << "CPU session: PASS\n";

              auto input =
                  interpreter->getSessionInput(session, nullptr);

              if (!input) {
                  std::cerr << "Input: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 4;
              }

              std::cout << "Input shape: [";
              for (int i = 0; i < input->dimensions(); ++i) {
                  if (i) std::cout << ",";
                  std::cout << input->length(i);
              }
              std::cout << "]\n";

              if (input->dimensions() != 4 ||
                  input->length(0) != 1 ||
                  input->length(1) != 32 ||
                  input->length(2) != 16 ||
                  input->length(3) != 16) {
                  std::cerr << "Input shape: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 5;
              }

              std::cout << "Input shape: PASS\n";

              MNN::Tensor hostTensor(
                  input,
                  MNN::Tensor::CAFFE,
                  true
              );

              float* host = hostTensor.host<float>();

              if (!host) {
                  std::cerr << "Host tensor: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 6;
              }

              const int elements = 1 * 32 * 16 * 16;

              for (int i = 0; i < elements; ++i) {
                  host[i] =
                      -0.05f +
                      static_cast<float>(i) * 0.000390625f;
              }

              std::cout
                  << "Latent sample: "
                  << host[0] << ", "
                  << host[1] << ", "
                  << host[2] << ", "
                  << host[3] << "\n";

              input->copyFromHostTensor(&hostTensor);

              std::cout << "Host -> MNN: PASS\n";
              std::cout << "Running MNN...\n";

              auto result =
                  interpreter->runSession(session);

              std::cout
                  << "MNN result: "
                  << result
                  << "\n";

              if (result != MNN::NO_ERROR) {
                  std::cerr << "MNN inference: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 7;
              }

              std::cout << "MNN inference: PASS\n";

              auto output =
                  interpreter->getSessionOutput(
                      session,
                      nullptr
                  );

              if (!output) {
                  std::cerr << "Output: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 8;
              }

              std::cout << "Output shape: [";
              for (int i = 0; i < output->dimensions(); ++i) {
                  if (i) std::cout << ",";
                  std::cout << output->length(i);
              }
              std::cout << "]\n";

              if (output->dimensions() != 4 ||
                  output->length(0) != 1 ||
                  output->length(1) != 3 ||
                  output->length(2) != 512 ||
                  output->length(3) != 512) {
                  std::cerr << "Output shape: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 9;
              }

              std::cout << "Output shape: PASS\n";

              MNN::Tensor outputHost(
                  output,
                  MNN::Tensor::CAFFE,
                  true
              );

              output->copyToHostTensor(&outputHost);

              float* data =
                  outputHost.host<float>();

              if (!data) {
                  std::cerr << "Output host: FAIL\n";
                  interpreter->releaseSession(session);
                  MNN::Interpreter::destroy(interpreter);
                  return 10;
              }

              int outputElements =
                  output->elementSize();

              float minValue = data[0];
              float maxValue = data[0];

              for (int i = 1; i < outputElements; ++i) {
                  minValue =
                      std::min(minValue, data[i]);
                  maxValue =
                      std::max(maxValue, data[i]);
              }

              std::cout
                  << "Output elements: "
                  << outputElements
                  << "\n";

              std::cout
                  << "Output[0]: "
                  << data[0]
                  << "\n";

              std::cout
                  << "Output min: "
                  << minValue
                  << "\n";

              std::cout
                  << "Output max: "
                  << maxValue
                  << "\n";

              std::cout << "============================================================\n";
              std::cout << "MNN VAE CPU TEST: PASS\n";
              std::cout << "============================================================\n";

              interpreter->releaseSession(session);
              MNN::Interpreter::destroy(interpreter);

              return 0;
          }
          CPP

      - name: Build MNN CPU test
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            test_mnn_vae.cpp \
            -I MNN/include \
            -L MNN/build \
            -lMNN \
            -lpthread \
            -ldl \
            -o test_mnn_vae
          echo "MNN test build: PASS"

      - name: Test MNN FP32 VAE
        run: |
          ./test_mnn_vae mnn_models/sana_vae_decoder_fp32.mnn

      - name: Convert verified MNN FP32 to FP16
        run: |
          MNN_CONVERT=$(cat mnn_converter_path.txt)

          echo "============================================================"
          echo "CONVERTING VERIFIED MNN FP32 VAE TO FP16"
          echo "============================================================"

          "$MNN_CONVERT" \
            -f MNN \
            --modelFile mnn_models/sana_vae_decoder_fp32.mnn \
            --MNNModel mnn_models/sana_vae_decoder_fp16.mnn \
            --fp16

          test -s mnn_models/sana_vae_decoder_fp16.mnn

          echo "FP16 conversion: PASS"
          ls -lh \
            mnn_models/sana_vae_decoder_fp32.mnn \
            mnn_models/sana_vae_decoder_fp16.mnn

      - name: Test MNN FP16 VAE
        run: |
          echo "============================================================"
          echo "MNN VAE FP16 CPU TEST"
          echo "============================================================"

          ./test_mnn_vae \
            mnn_models/sana_vae_decoder_fp16.mnn

          echo "MNN FP16 CPU test: PASS"

      - name: Create Android VAE package
        run: |
          rm -rf android_package
          mkdir -p android_package

          cp \
            mnn_models/sana_vae_decoder_fp16.mnn \
            android_package/sana_vae_decoder.mnn

          cp \
            sana_model/vae/config.json \
            android_package/config.json

          cp \
            sana_model/scheduler/scheduler_config.json \
            android_package/scheduler_config.json

          cat > android_package/MODEL_INFO.txt <<'EOF'
          Sana 0.6B / 512px VAE

          Runtime: MNN
          Precision: FP16 weights
          Input: [1,32,16,16]
          Output: [1,3,512,512]

          Validation:
          PyTorch VAE: PASS
          MNN FP32 CPU: PASS
          MNN FP16 CPU: PASS

          Android model filename:
          sana_vae_decoder.mnn
          EOF

          echo "Android package:"
          ls -lh android_package

      - name: Create Android ZIP
        run: |
          cd android_package
          zip -r ../sana_android_vae_fp16.zip .
          cd ..

          ls -lh sana_android_vae_fp16.zip

      - name: Upload VAE models
        uses: actions/upload-artifact@v4
        with:
          name: sana-vae-models
          path: |
            mnn_models/sana_vae_decoder_fp32.mnn
            mnn_models/sana_vae_decoder_fp16.mnn
          if-no-files-found: error

      - name: Upload Android VAE package
        uses: actions/upload-artifact@v4
        with:
          name: sana-android-vae-fp16
          path: sana_android_vae_fp16.zip
          if-no-files-found: error

      - name: Upload validation ONNX
        uses: actions/upload-artifact@v4
        with:
          name: sana-vae-onnx-validation
          path: |
            onnx/sana_vae_decoder.onnx
            onnx/sana_vae_decoder_final.onnx
          if-no-files-found: error

      - name: Final report
        run: |
          echo ""
          echo "======================================================================"
          echo "SANA VAE VALIDATION COMPLETE"
          echo "======================================================================"
          echo ""
          echo "PyTorch VAE       : PASS"
          echo "ONNX export       : PASS"
          echo "Transpose repair  : PASS"
          echo "MNN FP32          : PASS"
          echo "MNN FP32 CPU      : PASS"
          echo "MNN FP16          : PASS"
          echo "MNN FP16 CPU      : PASS"
          echo ""
          echo "Android package:"
          echo "sana_android_vae_fp16.zip"
          echo ""
          echo "Android model:"
          echo "sana_vae_decoder.mnn"
          echo ""
          echo "Input : [1,32,16,16]"
          echo "Output: [1,3,512,512]"
          echo ""
          echo "======================================================================"
