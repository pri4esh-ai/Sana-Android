name: Validate Sana VAE Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vae:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            build-essential \
            cmake \
            ninja-build


      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            torch==2.5.1 \
            torchvision==0.20.1 \
            diffusers==0.35.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            onnxruntime==1.20.1 \
            huggingface_hub==0.36.0 \
            numpy==1.26.4


      # ============================================================
      # DOWNLOAD OFFICIAL SANA MODEL
      # ============================================================

      - name: Download official Sana 0.6B 512px
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          repo = "Efficient-Large-Model/Sana_600M_512px_diffusers"

          print("=" * 70)
          print("DOWNLOADING OFFICIAL SANA 0.6B 512px")
          print("=" * 70)

          print("Repository:", repo)

          snapshot_download(
              repo_id=repo,
              local_dir="sana_model",
              local_dir_use_symlinks=False
          )

          print("")
          print("Sana model download complete.")
          PY


      # ============================================================
      # VERIFY VAE
      # ============================================================

      - name: Verify VAE files
        run: |
          echo ""
          echo "======================================================================"
          echo "SANA VAE FILES"
          echo "======================================================================"

          find sana_model/vae \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo ""

          test -d sana_model/vae
          test -f sana_model/vae/config.json

          echo "VAE directory: OK"
          echo "VAE config: OK"


      # ============================================================
      # CREATE VAE EXPORTER
      # ============================================================

      - name: Create VAE ONNX exporter
        run: |
          cat > export_vae.py <<'PY'

          import os
          import torch
          import onnx
          import numpy as np
          import onnxruntime as ort

          from diffusers import AutoencoderDC


          # ==========================================================
          # PATHS
          # ==========================================================

          MODEL_DIR = "sana_model/vae"
          OUTPUT_DIR = "onnx"

          os.makedirs(
              OUTPUT_DIR,
              exist_ok=True
          )


          # ==========================================================
          # HEADER
          # ==========================================================

          print("=" * 70)
          print("SANA 0.6B / 512px VAE VALIDATION")
          print("=" * 70)

          print("PyTorch:", torch.__version__)
          print("ONNX:", onnx.__version__)
          print("ONNX Runtime:", ort.__version__)


          # ==========================================================
          # LOAD VAE
          # ==========================================================

          print("")
          print("=" * 70)
          print("LOADING AutoencoderDC")
          print("=" * 70)

          vae = AutoencoderDC.from_pretrained(
              MODEL_DIR,
              torch_dtype=torch.float32
          )

          vae.eval()
          vae.to("cpu")

          print("VAE loaded successfully.")


          # ==========================================================
          # PRINT CONFIG
          # ==========================================================

          print("")
          print("=" * 70)
          print("VAE CONFIGURATION")
          print("=" * 70)

          print(
              "in_channels:",
              vae.config.in_channels
          )

          print(
              "latent_channels:",
              vae.config.latent_channels
          )

          print(
              "scaling_factor:",
              vae.config.scaling_factor
          )

          print(
              "decoder_block_out_channels:",
              vae.config.decoder_block_out_channels
          )

          print(
              "decoder_block_types:",
              vae.config.decoder_block_types
          )


          # ==========================================================
          # DECODER WRAPPER
          # ==========================================================

          class SanaVAEDecoder(torch.nn.Module):

              def __init__(self, model):
                  super().__init__()

                  self.model = model


              def forward(self, latent):

                  result = self.model.decode(
                      latent,
                      return_dict=False
                  )

                  return result[0]


          decoder = SanaVAEDecoder(
              vae
          )

          decoder.eval()


          # ==========================================================
          # STATIC 512x512 LATENT
          #
          # Sana VAE:
          #
          # 512 / 32 = 16
          #
          # Input:
          #
          # [1,32,16,16]
          #
          # Output:
          #
          # [1,3,512,512]
          # ==========================================================

          latent = torch.randn(
              1,
              32,
              16,
              16,
              dtype=torch.float32
          )


          expected_input = [
              1,
              32,
              16,
              16
          ]

          expected_output = [
              1,
              3,
              512,
              512
          ]


          print("")
          print("=" * 70)
          print("TEST INPUT")
          print("=" * 70)

          print(
              "Latent shape:",
              list(latent.shape)
          )

          print(
              "Latent elements:",
              latent.numel()
          )

          print(
              "Latent dtype:",
              latent.dtype
          )


          if list(latent.shape) != expected_input:

              raise RuntimeError(
                  "Unexpected latent shape: "
                  + str(list(latent.shape))
              )


          # ==========================================================
          # PYTORCH TEST
          # ==========================================================

          print("")
          print("=" * 70)
          print("PYTORCH VAE TEST")
          print("=" * 70)

          with torch.no_grad():

              pytorch_output = decoder(
                  latent
              )


          print(
              "PyTorch output shape:",
              list(pytorch_output.shape)
          )

          print(
              "PyTorch output dtype:",
              pytorch_output.dtype
          )

          print(
              "PyTorch output min:",
              float(pytorch_output.min())
          )

          print(
              "PyTorch output max:",
              float(pytorch_output.max())
          )


          if list(pytorch_output.shape) != expected_output:

              raise RuntimeError(
                  "Unexpected PyTorch VAE output shape: "
                  + str(list(pytorch_output.shape))
              )


          print("")
          print("PyTorch VAE TEST: PASS")


          # ==========================================================
          # EXPORT ONNX
          #
          # IMPORTANT:
          #
          # do_constant_folding=False
          #
          # This avoids the legacy ONNX exporter folding problematic
          # Slice/shape operations in the Sana DC-AE graph.
          # ==========================================================

          onnx_path = (
              OUTPUT_DIR +
              "/sana_vae_decoder.onnx"
          )


          print("")
          print("=" * 70)
          print("EXPORTING VAE TO ONNX")
          print("=" * 70)

          with torch.no_grad():

              torch.onnx.export(
                  decoder,
                  (latent,),
                  onnx_path,
                  input_names=[
                      "latent"
                  ],
                  output_names=[
                      "image"
                  ],
                  opset_version=17,
                  do_constant_folding=False,
                  external_data=True,
                  verbose=False
              )


          print("")
          print(
              "Created:",
              onnx_path
          )


          # ==========================================================
          # CHECK ONNX FILE
          # ==========================================================

          print("")
          print("=" * 70)
          print("VALIDATING RAW ONNX")
          print("=" * 70)

          onnx.checker.check_model(
              onnx_path
          )

          print(
              "ONNX CHECK: PASS"
          )


          # ==========================================================
          # LOAD ONNX WITH EXTERNAL DATA
          # ==========================================================

          print("")
          print("=" * 70)
          print("LOADING ONNX GRAPH")
          print("=" * 70)

          model = onnx.load(
              onnx_path,
              load_external_data=True
          )

          print(
              "ONNX graph loaded successfully."
          )


          # ==========================================================
          # SHAPE INFERENCE
          #
          # This resolves intermediate tensor shapes before
          # ONNX Runtime attempts to load the graph.
          # ==========================================================

          print("")
          print("=" * 70)
          print("RUNNING ONNX SHAPE INFERENCE")
          print("=" * 70)

          model = onnx.shape_inference.infer_shapes(
              model
          )

          print(
              "ONNX shape inference: PASS"
          )


          # ==========================================================
          # SAVE SHAPE-INFERRED MODEL
          #
          # Save to a separate path so the original export remains
          # available for debugging.
          # ==========================================================

          inferred_path = (
              OUTPUT_DIR +
              "/sana_vae_decoder_inferred.onnx"
          )


          onnx.save(
              model,
              inferred_path
          )


          print(
              "Shape-inferred ONNX:",
              inferred_path
          )


          # ==========================================================
          # CHECK SHAPE-INFERRED MODEL
          # ==========================================================

          print("")
          print("=" * 70)
          print("CHECKING SHAPE-INFERRED ONNX")
          print("=" * 70)

          onnx.checker.check_model(
              inferred_path
          )

          print(
              "Shape-inferred ONNX CHECK: PASS"
          )


          # ==========================================================
          # PRINT ONNX INPUTS / OUTPUTS
          # ==========================================================

          print("")
          print("=" * 70)
          print("ONNX GRAPH INPUTS / OUTPUTS")
          print("=" * 70)

          for value in model.graph.input:

              shape = []

              for dim in value.type.tensor_type.shape.dim:

                  if dim.dim_value:

                      shape.append(
                          dim.dim_value
                      )

                  elif dim.dim_param:

                      shape.append(
                          dim.dim_param
                      )

                  else:

                      shape.append(
                          "?"
                      )

              print(
                  "INPUT:",
                  value.name,
                  shape
              )


          for value in model.graph.output:

              shape = []

              for dim in value.type.tensor_type.shape.dim:

                  if dim.dim_value:

                      shape.append(
                          dim.dim_value
                      )

                  elif dim.dim_param:

                      shape.append(
                          dim.dim_param
                      )

                  else:

                      shape.append(
                          "?"
                      )

              print(
                  "OUTPUT:",
                  value.name,
                  shape
              )


          # ==========================================================
          # ONNX RUNTIME TEST
          # ==========================================================

          print("")
          print("=" * 70)
          print("ONNX RUNTIME CPU TEST")
          print("=" * 70)

          print(
              "Loading:",
              inferred_path
          )


          session = ort.InferenceSession(
              inferred_path,
              providers=[
                  "CPUExecutionProvider"
              ]
          )


          print(
              "ONNX Runtime session created."
          )


          input_info = (
              session.get_inputs()[0]
          )

          output_info = (
              session.get_outputs()[0]
          )


          print("")
          print(
              "ORT input name:",
              input_info.name
          )

          print(
              "ORT input shape:",
              input_info.shape
          )

          print(
              "ORT input type:",
              input_info.type
          )

          print("")
          print(
              "ORT output name:",
              output_info.name
          )

          print(
              "ORT output shape:",
              output_info.shape
          )

          print(
              "ORT output type:",
              output_info.type
          )


          # ==========================================================
          # RUN ORT
          # ==========================================================

          latent_np = (
              latent
              .cpu()
              .numpy()
              .astype(np.float32)
          )


          print("")
          print("Running ONNX Runtime...")


          ort_output = session.run(
              None,
              {
                  input_info.name:
                      latent_np
              }
          )[0]


          print("")
          print(
              "ORT output shape:",
              list(ort_output.shape)
          )

          print(
              "ORT output dtype:",
              ort_output.dtype
          )

          print(
              "ORT output min:",
              float(ort_output.min())
          )

          print(
              "ORT output max:",
              float(ort_output.max())
          )


          if list(ort_output.shape) != expected_output:

              raise RuntimeError(
                  "Unexpected ONNX Runtime output shape: "
                  + str(list(ort_output.shape))
              )


          print("")
          print(
              "ONNX Runtime output shape: PASS"
          )


          # ==========================================================
          # PYTORCH VS ONNX
          # ==========================================================

          print("")
          print("=" * 70)
          print("PYTORCH VS ONNX COMPARISON")
          print("=" * 70)


          pytorch_np = (
              pytorch_output
              .cpu()
              .numpy()
              .astype(np.float32)
          )


          difference = np.abs(
              pytorch_np -
              ort_output
          )


          max_difference = float(
              difference.max()
          )

          mean_difference = float(
              difference.mean()
          )


          print(
              "Maximum absolute difference:",
              max_difference
          )

          print(
              "Mean absolute difference:",
              mean_difference
          )


          if not np.allclose(
              pytorch_np,
              ort_output,
              rtol=1e-3,
              atol=1e-3
          ):

              raise RuntimeError(
                  "PyTorch and ONNX outputs differ too much."
              )


          print(
              "PyTorch vs ONNX: PASS"
          )


          # ==========================================================
          # FINAL RESULT
          # ==========================================================

          print("")
          print("=" * 70)
          print("VAE ONNX VALIDATION COMPLETE")
          print("=" * 70)

          print("")
          print("RESULT:")
          print("")
          print("PyTorch VAE      : PASS")
          print("ONNX export      : PASS")
          print("ONNX checker     : PASS")
          print("Shape inference  : PASS")
          print("ONNX Runtime CPU : PASS")
          print("Output           : [1,3,512,512]")
          print("")
          print("NEXT STEP: MNN CONVERSION")
          print("")


          PY


      # ============================================================
      # RUN PYTORCH + ONNX VALIDATION
      # ============================================================

      - name: Export and validate VAE
        run: |
          python export_vae.py


      # ============================================================
      # CLONE MNN
      # ============================================================

      - name: Clone MNN
        run: |
          git clone \
            --depth 1 \
            https://github.com/alibaba/MNN.git \
            MNN


      # ============================================================
      # BUILD MNN CONVERTER
      # ============================================================

      - name: Build MNN converter
        run: |
          cd MNN

          mkdir -p build

          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=OFF \
            -DMNN_BUILD_CONVERTER=ON \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_ARM82=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_OPENCV=OFF \
            -DMNN_IMGCODECS=OFF

          cmake \
            --build . \
            --target MNNConvert \
            -j2

          echo ""
          echo "MNN converter built."

          find . \
            -type f \
            -name MNNConvert \
            -print


      # ============================================================
      # FIND MNN CONVERTER
      # ============================================================

      - name: Locate MNNConvert
        run: |
          MNN_CONVERT=$(find MNN/build \
            -type f \
            -name MNNConvert \
            | head -1)

          if [ -z "$MNN_CONVERT" ]; then
            echo "ERROR: MNNConvert was not found."
            exit 1
          fi

          echo "$MNN_CONVERT" \
            > mnn_converter_path.txt

          echo ""
          echo "MNNConvert found:"
          echo "$MNN_CONVERT"


      # ============================================================
      # CONVERT VAE TO MNN FP32
      # ============================================================

      - name: Convert VAE ONNX to MNN FP32
        run: |
          mkdir -p mnn_models

          MNN_CONVERT=$(cat mnn_converter_path.txt)

          echo ""
          echo "======================================================================"
          echo "CONVERTING SANA VAE TO MNN FP32"
          echo "======================================================================"

          "$MNN_CONVERT" \
            -f ONNX \
            --modelFile onnx/sana_vae_decoder_inferred.onnx \
            --MNNModel mnn_models/sana_vae_decoder_fp32.mnn \
            --optimizePrefer=2

          echo ""
          echo "MNN VAE conversion finished."

          ls -lh \
            mnn_models/sana_vae_decoder_fp32.mnn


      # ============================================================
      # CREATE MNN CPU TEST
      # ============================================================

      - name: Create MNN VAE CPU test
        run: |
          cat > test_mnn_vae.cpp <<'CPP'

          #include <MNN/Interpreter.hpp>
          #include <MNN/Tensor.hpp>

          #include <algorithm>
          #include <iostream>


          int main(
              int argc,
              char** argv
          ) {

              if (argc < 2) {

                  std::cerr
                      << "Usage: test_mnn_vae <model.mnn>"
                      << std::endl;

                  return 1;
              }


              const char* modelPath =
                  argv[1];


              std::cout
                  << "============================================================"
                  << std::endl;

              std::cout
                  << "MNN VAE CPU TEST"
                  << std::endl;

              std::cout
                  << "============================================================"
                  << std::endl;


              std::cout
                  << "Model: "
                  << modelPath
                  << std::endl;


              // ----------------------------------------------------
              // CREATE INTERPRETER
              // ----------------------------------------------------

              auto interpreter =
                  MNN::Interpreter::createFromFile(
                      modelPath
                  );


              if (interpreter == nullptr) {

                  std::cerr
                      << "FAIL: Could not create MNN interpreter."
                      << std::endl;

                  return 2;
              }


              std::cout
                  << "Interpreter: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // CPU SESSION
              // ----------------------------------------------------

              MNN::ScheduleConfig config;

              config.type =
                  MNN_FORWARD_CPU;

              config.numThread = 2;


              auto session =
                  interpreter->createSession(
                      config
                  );


              if (session == nullptr) {

                  std::cerr
                      << "FAIL: Could not create CPU session."
                      << std::endl;

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 3;
              }


              std::cout
                  << "CPU session: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // INPUT
              // ----------------------------------------------------

              auto input =
                  interpreter->getSessionInput(
                      session,
                      nullptr
                  );


              if (input == nullptr) {

                  std::cerr
                      << "FAIL: Input tensor is null."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 4;
              }


              std::cout
                  << "Input shape: [";


              for (
                  int i = 0;
                  i < input->dimensions();
                  ++i
              ) {

                  if (i > 0)
                      std::cout << ",";

                  std::cout
                      << input->length(i);
              }


              std::cout
                  << "]"
                  << std::endl;


              const int expectedElements =
                  1 * 32 * 16 * 16;


              if (
                  input->dimensions() != 4 ||
                  input->length(0) != 1 ||
                  input->length(1) != 32 ||
                  input->length(2) != 16 ||
                  input->length(3) != 16
              ) {

                  std::cerr
                      << "FAIL: Unexpected MNN input shape."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 5;
              }


              std::cout
                  << "Input shape check: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // HOST TENSOR
              // ----------------------------------------------------

              MNN::Tensor hostTensor(
                  input,
                  MNN::Tensor::CAFFE,
                  true
              );


              float* data =
                  hostTensor.host<float>();


              if (data == nullptr) {

                  std::cerr
                      << "FAIL: Host tensor pointer is null."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 6;
              }


              // ----------------------------------------------------
              // FILL LATENT
              // ----------------------------------------------------

              for (
                  int i = 0;
                  i < expectedElements;
                  ++i
              ) {

                  data[i] =
                      -0.05f +
                      static_cast<float>(i)
                      * 0.000390625f;
              }


              std::cout
                  << "Latent sample: "
                  << data[0]
                  << ", "
                  << data[1]
                  << ", "
                  << data[2]
                  << ", "
                  << data[3]
                  << std::endl;


              // ----------------------------------------------------
              // COPY HOST -> MNN
              // ----------------------------------------------------

              std::cout
                  << "Copying host tensor to MNN input..."
                  << std::endl;


              input->copyFromHostTensor(
                  &hostTensor
              );


              std::cout
                  << "Host -> MNN copy: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // RUN INFERENCE
              // ----------------------------------------------------

              std::cout
                  << "Running MNN CPU inference..."
                  << std::endl;


              auto result =
                  interpreter->runSession(
                      session
                  );


              std::cout
                  << "runSession result: "
                  << result
                  << std::endl;


              if (
                  result != MNN::NO_ERROR
              ) {

                  std::cerr
                      << "FAIL: MNN inference failed."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 7;
              }


              std::cout
                  << "MNN inference: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // OUTPUT
              // ----------------------------------------------------

              auto output =
                  interpreter->getSessionOutput(
                      session,
                      nullptr
                  );


              if (output == nullptr) {

                  std::cerr
                      << "FAIL: Output tensor is null."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 8;
              }


              std::cout
                  << "Output shape: [";


              for (
                  int i = 0;
                  i < output->dimensions();
                  ++i
              ) {

                  if (i > 0)
                      std::cout << ",";

                  std::cout
                      << output->length(i);
              }


              std::cout
                  << "]"
                  << std::endl;


              // ----------------------------------------------------
              // OUTPUT SHAPE CHECK
              // ----------------------------------------------------

              if (
                  output->dimensions() != 4 ||
                  output->length(0) != 1 ||
                  output->length(1) != 3 ||
                  output->length(2) != 512 ||
                  output->length(3) != 512
              ) {

                  std::cerr
                      << "FAIL: Unexpected MNN output shape."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 9;
              }


              std::cout
                  << "Output shape check: PASS"
                  << std::endl;


              // ----------------------------------------------------
              // OUTPUT HOST TENSOR
              // ----------------------------------------------------

              MNN::Tensor outputHost(
                  output,
                  MNN::Tensor::CAFFE,
                  true
              );


              output->copyToHostTensor(
                  &outputHost
              );


              float* outputData =
                  outputHost.host<float>();


              if (outputData == nullptr) {

                  std::cerr
                      << "FAIL: Output host pointer is null."
                      << std::endl;

                  interpreter->releaseSession(
                      session
                  );

                  MNN::Interpreter::destroy(
                      interpreter
                  );

                  return 10;
              }


              const int outputElements =
                  output->elementSize();


              float minValue =
                  outputData[0];

              float maxValue =
                  outputData[0];


              for (
                  int i = 1;
                  i < outputElements;
                  ++i
              ) {

                  minValue =
                      std::min(
                          minValue,
                          outputData[i]
                      );

                  maxValue =
                      std::max(
                          maxValue,
                          outputData[i]
                      );
              }


              std::cout
                  << "Output elements: "
                  << outputElements
                  << std::endl;


              std::cout
                  << "Output[0]: "
                  << outputData[0]
                  << std::endl;


              std::cout
                  << "Output min: "
